id: UGR-3
type: Requirement
tier: 1
version: '1.0'
status: published
label: Top Management Commitment
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: Top management must demonstrate commitment to AI governance by approving the AI policy, allocating resources, and regularly reviewing AI governance performance.
intent: Ensure AI governance has executive-level support and resources to be effective.
applicability: All organizations that develop, deploy, or operate AI systems
expected_evidence: Executive meeting minutes, approved resource allocation documents, governance review reports, signed policy approval
related_controls: AI Governance Ownership, AI Policy Framework, Governance Review Cadence
requirement_type:
- standard
lifecycle_stages:
- all-stages
priority: high
risk_categories:
- governance
automation_potential: low
implementation_guidance:
- Schedule regular AI governance reviews at executive level
- Include AI governance in board or management reporting
- Document resource allocation decisions
- Maintain meeting minutes
- Track governance KPIs
