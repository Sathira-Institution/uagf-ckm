id: UGR-63
type: Requirement
tier: 1
version: '1.0'
status: published
label: Sensitive Data Protection
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must apply enhanced protections for sensitive personal data (e.g., health data, biometric data, racial or ethnic origin, political opinions, religious beliefs) processed by AI systems, including explicit consent where required.
intent: Ensure enhanced protection for sensitive data that carries higher privacy risk.
applicability: Organizations processing sensitive personal data through AI systems
expected_evidence: Sensitive data identification records, enhanced control implementation, consent records, monitoring logs
related_controls: Data Classification, Enhanced Data Protection, Consent Management
requirement_type:
- legal
lifecycle_stages:
- all-stages
priority: high
risk_categories:
- privacy
- human-rights
automation_potential: high
implementation_guidance:
- Identify sensitive data
- Apply enhanced controls
- Obtain explicit consent where required
- Document processing
- Monitor compliance
