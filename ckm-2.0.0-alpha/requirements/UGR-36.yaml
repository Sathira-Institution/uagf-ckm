id: UGR-36
type: Requirement
tier: 1
version: '1.0'
status: published
label: Audit Trail Retention
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must retain audit trails for AI systems for a defined retention period (minimum 5 years for high-risk systems) in a tamper-evident format that supports retrieval and replay.
intent: Ensure evidence is available for audits, investigations, and regulatory reviews.
applicability: All organizations with AI systems
expected_evidence: Retention policy document, retention implementation records, retrieval test results, retention compliance reports
related_controls: Log Retention, Data Archiving, Evidence Management
requirement_type:
- legal
- standard
lifecycle_stages:
- all-stages
priority: high
risk_categories:
- auditability
- compliance
automation_potential: high
implementation_guidance:
- Define retention periods by risk tier
- Implement tamper-evident storage
- Test retrieval
- Verify integrity
- Document retention policies
