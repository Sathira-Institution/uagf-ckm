id: UGR-25
type: Requirement
tier: 1
version: '1.0'
status: published
label: AI System Disclosure
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: Users must be informed when they are interacting with an AI system, including the nature and purpose of the system, in a clear and understandable manner.
intent: Ensure users are aware they are interacting with AI and can make informed decisions about their engagement.
applicability: All organizations with user-facing AI systems
expected_evidence: Disclosure mechanism implementation records, user awareness verification, disclosure policy documents
related_controls: Transparency Control, User Notification, Consent Management
requirement_type:
- legal
- principle
lifecycle_stages:
- operation
priority: high
risk_categories:
- transparency
- human-rights
automation_potential: medium
implementation_guidance:
- Identify all user-facing AI systems
- Design disclosure mechanisms
- Implement disclosures
- Verify user awareness
- Monitor compliance
