id: UGR-50
type: Requirement
tier: 1
version: '1.0'
status: published
label: AI System Security
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: AI systems must be protected against unauthorized access, manipulation, and misuse through appropriate security controls, including access control, encryption, and monitoring.
intent: Prevent security breaches that could compromise AI system integrity, confidentiality, or availability.
applicability: All organizations with AI systems
expected_evidence: Security control implementation records, security assessment results, incident response records, monitoring logs
related_controls: Access Control, Encryption, Security Monitoring, Incident Response
requirement_type:
- legal
- standard
lifecycle_stages:
- all-stages
priority: high
risk_categories:
- security
automation_potential: high
implementation_guidance:
- Conduct security risk assessments
- Implement security controls
- Monitor security events
- Test security regularly
- Respond to incidents
