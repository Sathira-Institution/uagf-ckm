id: UGR-21
type: Requirement
tier: 1
version: '1.0'
status: published
label: Data Lineage and Provenance
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must maintain data lineage records that track the origin, transformation, and flow of data used in AI systems from source to consumption, enabling traceability and auditability.
intent: Enable traceability of data used in AI systems for audit, compliance, and error investigation.
applicability: All organizations that develop or operate AI systems
expected_evidence: Data lineage records, data flow diagrams, transformation logs, lineage verification records
related_controls: Data Tracking, Data Provenance, Audit Logging
requirement_type:
- legal
- standard
lifecycle_stages:
- development
- operation
priority: high
risk_categories:
- privacy
- fairness
- auditability
automation_potential: high
implementation_guidance:
- Document data sources
- Track data transformations
- Maintain lineage records
- Include lineage in audit trails
- Verify lineage accuracy
