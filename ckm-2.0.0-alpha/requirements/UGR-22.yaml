id: UGR-22
type: Requirement
tier: 1
version: '1.0'
status: published
label: Data Classification for AI Systems
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must classify data used in AI systems according to sensitivity, regulatory requirements, and risk, and apply appropriate controls based on classification.
intent: Ensure appropriate protection for data based on sensitivity and regulatory requirements.
applicability: All organizations that process data through AI systems
expected_evidence: Data classification schema, classification assignments, control implementation records, classification review records
related_controls: Data Protection, Access Control, Data Handling Procedures
requirement_type:
- legal
- standard
lifecycle_stages:
- all-stages
priority: high
risk_categories:
- privacy
- security
automation_potential: high
implementation_guidance:
- Define data classification schema
- Classify data used in AI systems
- Apply controls based on classification
- Document classification decisions
- Review classifications periodically
