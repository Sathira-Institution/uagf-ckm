id: UGR-26
type: Requirement
tier: 1
version: '1.0'
status: published
label: Synthetic Content Labeling
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: AI-generated synthetic content (including text, images, audio, and video) must be clearly labeled as AI-generated or AI-manipulated in a machine-readable and human-readable format.
intent: Prevent deception by ensuring users can identify AI-generated content.
applicability: Organizations that generate synthetic content using AI
expected_evidence: Labeling implementation records, content labeling examples, integrity verification records
related_controls: Content Labeling, Provenance Tracking, Integrity Verification
requirement_type:
- legal
- standard
lifecycle_stages:
- operation
priority: high
risk_categories:
- transparency
- disinformation
automation_potential: high
implementation_guidance:
- Implement content labeling mechanisms
- Use standard formats (e.g., C2PA)
- Label all synthetic content
- Verify labeling integrity
- Include labeling in audit trails
