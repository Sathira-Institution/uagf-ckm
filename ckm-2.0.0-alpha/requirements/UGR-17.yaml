id: UGR-17
type: Requirement
tier: 1
version: '1.0'
status: published
label: Human Intervention Mechanism
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must implement mechanisms that allow authorized human operators to intervene, override, or halt AI system actions in real time when necessary to prevent harm or correct erroneous behavior.
intent: Ensure humans can stop or correct AI actions when necessary.
applicability: Organizations deploying high-risk AI systems
expected_evidence: Intervention mechanism design documentation, intervention procedure documents, training completion records, intervention logs
related_controls: Human Oversight Control, Emergency Stop, Rollback Procedure
requirement_type:
- legal
- standard
lifecycle_stages:
- design
- development
- operation
priority: critical
risk_categories:
- human-rights
- safety
- accountability
automation_potential: medium
implementation_guidance:
- Design intervention mechanisms
- Document intervention procedures
- Train operators
- Log all interventions
- Review intervention effectiveness
