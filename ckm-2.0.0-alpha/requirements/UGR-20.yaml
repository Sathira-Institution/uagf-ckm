id: UGR-20
type: Requirement
tier: 1
version: '1.0'
status: published
label: Data Quality for AI Systems
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must ensure that data used for training, validation, and operation of AI systems is of sufficient quality, including accuracy, completeness, relevance, and representativeness for the intended use.
intent: Prevent AI system errors and biases caused by poor quality data.
applicability: All organizations that develop or operate AI systems
expected_evidence: Data quality criteria documentation, data quality assessment reports, remediation records, data quality monitoring logs
related_controls: Data Quality Control, Data Validation, Data Monitoring
requirement_type:
- legal
- standard
lifecycle_stages:
- development
- operation
priority: high
risk_categories:
- fairness
- safety
- privacy
automation_potential: high
implementation_guidance:
- Define data quality criteria
- Implement data quality checks
- Document data quality assessments
- Address quality issues
- Monitor data quality continuously
