id: UGR-2
type: Requirement
tier: 1
version: '1.0'
status: published
label: AI Policy Framework
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must establish, document, and maintain an AI policy that defines governance principles, risk tolerance, ethical commitments, and compliance requirements for AI systems.
intent: Provide a formal, documented foundation for AI governance that communicates organizational commitments and expectations.
applicability: All organizations that develop, deploy, or operate AI systems
expected_evidence: Approved AI policy document, communication records, training completion records, policy review records
related_controls: AI Governance Ownership, Top Management Commitment, Policy Communication and Training
requirement_type:
- standard
lifecycle_stages:
- all-stages
priority: high
risk_categories:
- governance
automation_potential: low
implementation_guidance:
- Draft AI policy with input from legal, risk, and technical stakeholders
- Obtain executive approval
- Publish and communicate to all relevant staff
- Review and update annually
- Document version history
