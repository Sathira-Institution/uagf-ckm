id: UGR-16
type: Requirement
tier: 1
version: '1.0'
status: published
label: Human Approval Workflow
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must establish documented approval workflows for AI system decisions, specifying who must approve which types of decisions, under what conditions, and within what timeframe.
intent: Ensure decisions of consequence are routed through a documented, accountable approval process before execution.
applicability: All organizations with AI systems that make consequential decisions
expected_evidence: Approval workflow documentation, approval records, escalation logs, workflow review records
related_controls: Approval Workflow, Human Oversight Control, Escalation Procedure
requirement_type:
- standard
lifecycle_stages:
- design
- development
- operation
priority: high
risk_categories:
- accountability
- governance
automation_potential: medium
implementation_guidance:
- Identify decisions requiring approval
- Define approvers and conditions
- Document timeframes and escalation paths
- Implement workflow tooling
- Review workflow effectiveness periodically
