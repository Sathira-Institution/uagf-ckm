id: UGR-61
type: Requirement
tier: 1
version: '1.0'
status: published
label: Data Subject Rights
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must support data subject rights in AI systems, including the right to access, correct, delete, restrict processing, object, and data portability, with documented procedures and response timelines.
intent: Protect individual rights regarding personal data processed by AI systems.
applicability: Organizations processing personal data through AI systems
expected_evidence: Rights request procedures, request response records, response time monitoring, training records
related_controls: Data Subject Request Management, Privacy Rights, Access Control
requirement_type:
- legal
lifecycle_stages:
- operation
priority: high
risk_categories:
- privacy
- human-rights
automation_potential: high
implementation_guidance:
- Map data subject rights to AI systems
- Define response procedures
- Implement request mechanisms
- Train staff
- Monitor response times
