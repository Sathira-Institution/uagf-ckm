id: UGR-60
type: Requirement
tier: 1
version: '1.0'
status: published
label: Lawful Basis for Personal Data Processing
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must establish and document a lawful basis for all processing of personal data by AI systems, including consent, contract, legal obligation, vital interest, public task, or legitimate interest.
intent: Ensure all personal data processing by AI systems has a valid legal foundation.
applicability: Organizations processing personal data through AI systems
expected_evidence: Lawful basis documentation, privacy notices, consent records (if applicable), processing activity records
related_controls: Data Protection Impact Assessment, Privacy Notice, Consent Management
requirement_type:
- legal
lifecycle_stages:
- all-stages
priority: critical
risk_categories:
- privacy
- human-rights
automation_potential: medium
implementation_guidance:
- Map AI data processing to lawful bases
- Document lawful bases
- Review periodically
- Include in privacy notices
- Maintain records
