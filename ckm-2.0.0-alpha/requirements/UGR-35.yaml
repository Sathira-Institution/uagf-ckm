id: UGR-35
type: Requirement
tier: 1
version: '1.0'
status: published
label: AI System Logging
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: AI systems must log all material decisions, actions, and events, including inputs, outputs, decision rationale, and human interventions, in a format suitable for audit and review.
intent: Enable audit, investigation, and continuous improvement through complete records of AI system behavior.
applicability: All organizations with AI systems
expected_evidence: Logging policy, log records, log retrieval test results, log integrity verification records
related_controls: Audit Logging Control, Log Retention, Log Integrity
requirement_type:
- legal
- standard
lifecycle_stages:
- all-stages
priority: critical
risk_categories:
- auditability
- accountability
automation_potential: high
implementation_guidance:
- Define logging requirements
- Implement logging mechanisms
- Ensure logs are immutable
- Retain logs per policy
- Test log retrieval
