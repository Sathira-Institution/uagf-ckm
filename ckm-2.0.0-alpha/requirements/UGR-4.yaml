id: UGR-4
type: Requirement
tier: 1
version: '1.0'
status: published
label: AI Governance Roles and Responsibilities
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must define and document roles, responsibilities, and authorities for AI governance, including who is accountable for AI system decisions, risk management, and compliance.
intent: Ensure clear accountability for AI-related decisions and activities across the organization.
applicability: All organizations that develop, deploy, or operate AI systems
expected_evidence: RACI matrix, role descriptions, org chart, accountability assignment records
related_controls: Human Oversight, Accountability Chain, Access Control
requirement_type:
- standard
- legal
lifecycle_stages:
- all-stages
priority: high
risk_categories:
- governance
- accountability
automation_potential: medium
implementation_guidance:
- Map AI governance roles to organizational structure
- Document responsibilities in RACI matrices
- Communicate roles to all relevant personnel
- Include in training programs
- Review and update annually
