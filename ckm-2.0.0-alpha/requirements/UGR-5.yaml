id: UGR-5
type: Requirement
tier: 1
version: '1.0'
status: published
label: AI Risk Management System
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must establish, implement, and maintain a risk management system for AI systems that identifies, analyzes, evaluates, treats, and monitors AI-related risks throughout the AI system lifecycle.
intent: Ensure systematic identification and management of AI risks from design through deployment and operation.
applicability: Organizations deploying high-risk AI systems; all organizations with AI systems
expected_evidence: Risk assessment methodology document, completed risk assessments, risk treatment plans, risk monitoring records, risk review meeting minutes
related_controls: Risk Assessment, Risk Treatment, Risk Monitoring, Risk Review
requirement_type:
- legal
- standard
lifecycle_stages:
- design
- development
- deployment
- operation
priority: critical
risk_categories:
- safety
- human-rights
- governance
automation_potential: medium
implementation_guidance:
- Define AI risk assessment methodology
- Conduct risk assessments for all AI systems
- Document risk treatment plans
- Monitor risks continuously
- Review and update assessments regularly
