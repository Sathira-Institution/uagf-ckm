id: UGR-62
type: Requirement
tier: 1
version: '1.0'
status: published
label: Data Protection Impact Assessment
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must conduct Data Protection Impact Assessments (DPIAs) for AI systems that process personal data, particularly where processing is likely to result in high risk to individuals' rights and freedoms.
intent: Identify and mitigate privacy risks before AI systems process personal data.
applicability: Organizations processing personal data through AI systems
expected_evidence: DPIA documentation, mitigation records, approval records, review records
related_controls: Privacy Impact Assessment, Risk Assessment, Data Protection
requirement_type:
- legal
- standard
lifecycle_stages:
- design
- development
- deployment
priority: high
risk_categories:
- privacy
automation_potential: medium
implementation_guidance:
- Define DPIA methodology
- Conduct DPIAs for high-risk AI systems
- Document findings
- Implement mitigations
- Review periodically
