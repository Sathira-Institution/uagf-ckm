id: UGR-51
type: Requirement
tier: 1
version: '1.0'
status: published
label: AI System Security Testing
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: AI systems must be tested for security vulnerabilities before deployment and periodically during operation, with findings documented and remediated.
intent: Identify and remediate security vulnerabilities before they can be exploited.
applicability: All organizations with AI systems
expected_evidence: Security testing reports, vulnerability remediation records, testing schedule, penetration test results
related_controls: Vulnerability Management, Security Testing, Penetration Testing
requirement_type:
- standard
lifecycle_stages:
- development
- deployment
- operation
priority: medium
risk_categories:
- security
automation_potential: medium
implementation_guidance:
- Define security testing requirements
- Conduct pre-deployment testing
- Schedule periodic testing
- Document findings
- Remediate vulnerabilities
