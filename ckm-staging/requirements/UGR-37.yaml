id: UGR-37
type: Requirement
tier: 1
version: '1.0'
status: proposed
label: Audit Trail Retrieval
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must be able to retrieve audit trails for AI systems upon request from authorized parties (auditors, regulators, data subjects) within a reasonable timeframe.
intent: Enable timely response to audit and regulatory requests.
applicability: All organizations with AI systems
expected_evidence: Retrieval procedure documentation, retrieval test results, response time records, retrieval request logs
related_controls: Log Retrieval, Audit Response, Data Access
requirement_type:
- legal
- standard
lifecycle_stages:
- all-stages
priority: high
risk_categories:
- auditability
- compliance
automation_potential: high
implementation_guidance:
- Design retrieval mechanisms
- Test retrieval regularly
- Define response SLAs
- Document retrieval procedures
- Train staff
