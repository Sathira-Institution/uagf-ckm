id: UGR-45
type: Requirement
tier: 1
version: '1.0'
status: proposed
label: Human Accountability for AI Outcomes
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must ensure that every consequential AI decision has a clearly identified human accountable for the outcome, with documented responsibility and authority.
intent: Maintain human responsibility for AI outcomes, preventing accountability gaps.
applicability: All organizations with AI systems that make consequential decisions
expected_evidence: Accountability assignment records, accountability documentation, training records, incident review records
related_controls: Human Oversight Control, Accountability Chain, Incident Management
requirement_type:
- legal
- standard
- principle
lifecycle_stages:
- all-stages
priority: critical
risk_categories:
- accountability
- human-rights
automation_potential: medium
implementation_guidance:
- Map AI decisions to accountable humans
- Document accountability assignments
- Include in approval workflows
- Log accountability records
- Review assignments regularly
