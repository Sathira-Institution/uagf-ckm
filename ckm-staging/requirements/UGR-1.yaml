id: UGR-1
type: Requirement
tier: 1
version: '1.0'
status: proposed
label: AI Governance Ownership
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must designate a person or function with overall accountability for AI governance, including policy development, risk oversight, and compliance monitoring.
intent: Ensure clear ownership and accountability for AI governance across the organization.
applicability: All organizations that develop, deploy, or operate AI systems
expected_evidence: AI governance role description, assignment documentation, org chart showing AI governance structure, meeting minutes of governance reviews
related_controls: AI Policy Framework, Top Management Commitment, Governance Roles and Responsibilities
requirement_type:
- standard
- legal
lifecycle_stages:
- all-stages
priority: high
risk_categories:
- governance
automation_potential: medium
implementation_guidance:
- Define AI governance role with documented responsibilities
- Assign to an accountable individual or committee
- Include in job descriptions and performance objectives
- Document the assignment
- Review annually
