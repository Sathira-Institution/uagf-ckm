id: UGR-6
type: Requirement
tier: 1
version: '1.0'
status: proposed
label: AI Risk Classification
owner_module: M-CORE
created: '2026-06-28'
modified: '2026-07-28'
statement: The organization must classify each AI system according to its risk level, considering the potential impact on health, safety, fundamental rights, and organizational objectives.
intent: Enable proportionate governance by matching controls to risk level.
applicability: All organizations that deploy AI systems
expected_evidence: Risk classification criteria document, classification records per AI system, classification review records
related_controls: Risk Assessment, Proportional Controls, Risk-based Approval
requirement_type:
- legal
- standard
lifecycle_stages:
- design
- development
- deployment
priority: high
risk_categories:
- safety
- human-rights
- governance
automation_potential: high
implementation_guidance:
- Define risk classification criteria
- Assess each AI system against criteria
- Assign risk tier (e.g., Low/Medium/High/Critical)
- Document classification decisions
- Review classifications periodically
